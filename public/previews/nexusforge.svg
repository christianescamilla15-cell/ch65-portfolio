      <g transform="translate(0,0)"><rect width="170" height="48" rx="8" fill="#1a2438" stroke="#2a3650"/><text x="14" y="20" fill="#e9f0fb" font-family="ui-monospace, monospace" font-size="11">Router</text><text x="14" y="36" fill="#6ea8ff" font-family="ui-monospace, monospace" font-size="10">gemma3:4b</text></g>
      <g transform="translate(180,0)"><rect width="170" height="48" rx="8" fill="#1a2438" stroke="#2a3650"/><text x="14" y="20" fill="#e9f0fb" font-family="ui-monospace, monospace" font-size="11">Planner</text><text x="14" y="36" fill="#6ea8ff" font-family="ui-monospace, monospace" font-size="10">claude-opus</text></g>
      <g transform="translate(360,0)"><rect width="170" height="48" rx="8" fill="#1a2438" stroke="#2a3650"/><text x="14" y="20" fill="#e9f0fb" font-family="ui-monospace, monospace" font-size="11">Researcher</text><text x="14" y="36" fill="#6ea8ff" font-family="ui-monospace, monospace" font-size="10">groq-llama</text></g>
      <g transform="translate(540,0)"><rect width="170" height="48" rx="8" fill="#1a2438" stroke="#2a3650"/><text x="14" y="20" fill="#e9f0fb" font-family="ui-monospace, monospace" font-size="11">Critic</text><text x="14" y="36" fill="#6ea8ff" font-family="ui-monospace, monospace" font-size="10">deepseek-r1</text></g>
      <g transform="translate(720,0)"><rect width="170" height="48" rx="8" fill="#1a2438" stroke="#2a3650"/><text x="14" y="20" fill="#e9f0fb" font-family="ui-monospace, monospace" font-size="11">Extractor</text><text x="14" y="36" fill="#6ea8ff" font-family="ui-monospace, monospace" font-size="10">qwen2.5-cod</text></g>
      <g transform="translate(900,0)"><rect width="170" height="48" rx="8" fill="#1a2438" stroke="#2a3650"/><text x="14" y="20" fill="#e9f0fb" font-family="ui-monospace, monospace" font-size="11">Validator</text><text x="14" y="36" fill="#6ea8ff" font-family="ui-monospace, monospace" font-size="10">qwen2.5-cod</text></g>
      <!-- Row 2 -->
      <g transform="translate(0,60)"><rect width="170" height="48" rx="8" fill="#1a2438" stroke="#2a3650"/><text x="14" y="20" fill="#e9f0fb" font-family="ui-monospace, monospace" font-size="11">Repair</text><text x="14" y="36" fill="#6ea8ff" font-family="ui-monospace, monospace" font-size="10">qwen2.5-cod</text></g>
      <g transform="translate(180,60)"><rect width="170" height="48" rx="8" fill="#1a2438" stroke="#2a3650"/><text x="14" y="20" fill="#e9f0fb" font-family="ui-monospace, monospace" font-size="11">Knowledge</text><text x="14" y="36" fill="#6ea8ff" font-family="ui-monospace, monospace" font-size="10">qwen2.5-cod</text></g>
      <g transform="translate(360,60)"><rect width="170" height="48" rx="8" fill="#1a2438" stroke="#2a3650"/><text x="14" y="20" fill="#e9f0fb" font-family="ui-monospace, monospace" font-size="11">Summarizer</text><text x="14" y="36" fill="#6ea8ff" font-family="ui-monospace, monospace" font-size="10">llama3.1:8b</text></g>
      <g transform="translate(540,60)"><rect width="170" height="48" rx="8" fill="#1a2438" stroke="#2a3650"/><text x="14" y="20" fill="#e9f0fb" font-family="ui-monospace, monospace" font-size="11">Translator</text><text x="14" y="36" fill="#6ea8ff" font-family="ui-monospace, monospace" font-size="10">llama3.1:8b</text></g>
      <g transform="translate(720,60)"><rect width="170" height="48" rx="8" fill="#1a2438" stroke="#2a3650"/><text x="14" y="20" fill="#e9f0fb" font-family="ui-monospace, monospace" font-size="11">Enricher</text><text x="14" y="36" fill="#6ea8ff" font-family="ui-monospace, monospace" font-size="10">llama3.1:8b</text></g>
      <g transform="translate(900,60)"><rect width="170" height="48" rx="8" fill="#1a2438" stroke="#2a3650"/><text x="14" y="20" fill="#e9f0fb" font-family="ui-monospace, monospace" font-size="11">Analyzer</text><text x="14" y="36" fill="#6ea8ff" font-family="ui-monospace, monospace" font-size="10">llama3.1:8b</text></g>
      <!-- Row 3 -->
      <g transform="translate(0,120)"><rect width="170" height="48" rx="8" fill="#1a2438" stroke="#2a3650"/><text x="14" y="20" fill="#e9f0fb" font-family="ui-monospace, monospace" font-size="11">Classifier</text><text x="14" y="36" fill="#6ea8ff" font-family="ui-monospace, monospace" font-size="10">gemma3:4b</text></g>
      <g transform="translate(180,120)"><rect width="170" height="48" rx="8" fill="#1a2438" stroke="#2a3650"/><text x="14" y="20" fill="#e9f0fb" font-family="ui-monospace, monospace" font-size="11">Sentiment</text><text x="14" y="36" fill="#6ea8ff" font-family="ui-monospace, monospace" font-size="10">gemma3:4b</text></g>
      <g transform="translate(360,120)"><rect width="170" height="48" rx="8" fill="#1a2438" stroke="#2a3650"/><text x="14" y="20" fill="#e9f0fb" font-family="ui-monospace, monospace" font-size="11">Compliance</text><text x="14" y="36" fill="#6ea8ff" font-family="ui-monospace, monospace" font-size="10">claude-sonnet</text></g>
      <g transform="translate(540,120)"><rect width="170" height="48" rx="8" fill="#1a2438" stroke="#2a3650"/><text x="14" y="20" fill="#e9f0fb" font-family="ui-monospace, monospace" font-size="11">Reporter</text><text x="14" y="36" fill="#6ea8ff" font-family="ui-monospace, monospace" font-size="10">claude-opus</text></g>
      <g transform="translate(720,120)"><rect width="170" height="48" rx="8" fill="#1a2438" stroke="#2a3650"/><text x="14" y="20" fill="#e9f0fb" font-family="ui-monospace, monospace" font-size="11">Monitor</text><text x="14" y="36" fill="#6ea8ff" font-family="ui-monospace, monospace" font-size="10">llama3.1:8b</text></g>
      <g transform="translate(900,120)"><rect width="170" height="48" rx="8" fill="#1a2438" stroke="#2a3650"/><text x="14" y="20" fill="#e9f0fb" font-family="ui-monospace, monospace" font-size="11">OCRAgent</text><text x="14" y="36" fill="#6ea8ff" font-family="ui-monospace, monospace" font-size="10">llama3.1:8b</text></g>
      <!-- Row 4 -->
      <g transform="translate(0,180)"><rect width="170" height="48" rx="8" fill="#1a2438" stroke="#2a3650"/><text x="14" y="20" fill="#e9f0fb" font-family="ui-monospace, monospace" font-size="11">Scheduler</text><text x="14" y="36" fill="#6ea8ff" font-family="ui-monospace, monospace" font-size="10">llama3.1:8b</text></g>
      <g transform="translate(180,180)"><rect width="170" height="48" rx="8" fill="#1a2438" stroke="#2a3650"/><text x="14" y="20" fill="#e9f0fb" font-family="ui-monospace, monospace" font-size="11">Scraper</text><text x="14" y="36" fill="#6ea8ff" font-family="ui-monospace, monospace" font-size="10">llama3.1:8b</text></g>
      <g transform="translate(360,180)"><rect width="170" height="48" rx="8" fill="#1a2438" stroke="#2a3650"/><text x="14" y="20" fill="#e9f0fb" font-family="ui-monospace, monospace" font-size="11">Judge</text><text x="14" y="36" fill="#6ea8ff" font-family="ui-monospace, monospace" font-size="10">gemma4:27b</text></g>
      <g transform="translate(540,180)"><rect width="170" height="48" rx="8" fill="#1a2438" stroke="#2a3650"/><text x="14" y="20" fill="#e9f0fb" font-family="ui-monospace, monospace" font-size="11">MetaThink</text><text x="14" y="36" fill="#6ea8ff" font-family="ui-monospace, monospace" font-size="10">gemma3:4b</text></g>
      <g transform="translate(720,180)"><rect width="170" height="48" rx="8" fill="#1a2438" stroke="#2a3650"/><text x="14" y="20" fill="#e9f0fb" font-family="ui-monospace, monospace" font-size="11">MetaBuild</text><text x="14" y="36" fill="#6ea8ff" font-family="ui-monospace, monospace" font-size="10">qwen2.5-cod</text></g>
      <g transform="translate(900,180)"><rect width="170" height="48" rx="8" fill="#1a2438" stroke="#2a3650"/><text x="14" y="20" fill="#e9f0fb" font-family="ui-monospace, monospace" font-size="11">MetaVerify</text><text x="14" y="36" fill="#6ea8ff" font-family="ui-monospace, monospace" font-size="10">deepseek-r1</text></g>
