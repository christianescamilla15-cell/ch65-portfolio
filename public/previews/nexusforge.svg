<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">NexusForge AI — 24-Agent Orchestration</title>
  <desc id="desc">Multi-agent platform with 24 agents organized in 6 swarm topologies, MCP via Claude Agent SDK, RAG over pgvector + Voyage AI, 780+ tests, 74K LOC Python.</desc>

  <!-- Background gradient (dark, matches dark hero tile) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0f1828"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6ea8ff"/>
      <stop offset="100%" stop-color="#9b6eff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>

  <!-- Glow halo top-left -->
  <circle cx="160" cy="120" r="280" fill="#6ea8ff" opacity="0.08"/>
  <circle cx="1040" cy="600" r="240" fill="#9b6eff" opacity="0.07"/>

  <!-- Header bar -->
  <g transform="translate(60, 50)">
    <rect width="1080" height="48" rx="10" fill="#1a2438" stroke="#2a3650" stroke-width="1"/>
    <circle cx="22" cy="24" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="24" r="6" fill="#ffbd2e"/>
    <circle cx="58" cy="24" r="6" fill="#27c93f"/>
    <text x="540" y="29" text-anchor="middle" fill="#9fb0c7" font-family="ui-monospace, monospace" font-size="13">07-nexusforge-ai.vercel.app</text>
  </g>

  <!-- Title -->
  <g transform="translate(60, 130)">
    <text fill="#e9f0fb" font-family="-apple-system, system-ui, sans-serif" font-size="34" font-weight="700">NexusForge AI</text>
    <text x="0" y="34" fill="#9fb0c7" font-family="-apple-system, system-ui, sans-serif" font-size="16">Enterprise Multi-Agent Orchestration · MCP-native · 780+ tests</text>
  </g>

  <!-- Metrics row -->
  <g transform="translate(60, 220)">
    <g>
      <rect width="180" height="80" rx="12" fill="#121a2a" stroke="#2a3650"/>
      <text x="20" y="34" fill="url(#accent)" font-family="-apple-system, system-ui, sans-serif" font-size="28" font-weight="700">24</text>
      <text x="20" y="58" fill="#9fb0c7" font-family="-apple-system, system-ui, sans-serif" font-size="13">Agents · 6 topologies</text>
    </g>
    <g transform="translate(196, 0)">
      <rect width="180" height="80" rx="12" fill="#121a2a" stroke="#2a3650"/>
      <text x="20" y="34" fill="url(#accent)" font-family="-apple-system, system-ui, sans-serif" font-size="28" font-weight="700">5-tier</text>
      <text x="20" y="58" fill="#9fb0c7" font-family="-apple-system, system-ui, sans-serif" font-size="13">Memory architecture</text>
    </g>
    <g transform="translate(392, 0)">
      <rect width="180" height="80" rx="12" fill="#121a2a" stroke="#2a3650"/>
      <text x="20" y="34" fill="url(#accent)" font-family="-apple-system, system-ui, sans-serif" font-size="28" font-weight="700">MCP</text>
      <text x="20" y="58" fill="#9fb0c7" font-family="-apple-system, system-ui, sans-serif" font-size="13">Claude Agent SDK</text>
    </g>
    <g transform="translate(588, 0)">
      <rect width="180" height="80" rx="12" fill="#121a2a" stroke="#2a3650"/>
      <text x="20" y="34" fill="url(#accent)" font-family="-apple-system, system-ui, sans-serif" font-size="28" font-weight="700">780+</text>
      <text x="20" y="58" fill="#9fb0c7" font-family="-apple-system, system-ui, sans-serif" font-size="13">Tests passing</text>
    </g>
    <g transform="translate(784, 0)">
      <rect width="180" height="80" rx="12" fill="#121a2a" stroke="#2a3650"/>
      <text x="20" y="34" fill="url(#accent)" font-family="-apple-system, system-ui, sans-serif" font-size="28" font-weight="700">90%</text>
      <text x="20" y="58" fill="#9fb0c7" font-family="-apple-system, system-ui, sans-serif" font-size="13">Prompt caching savings</text>
    </g>
  </g>

